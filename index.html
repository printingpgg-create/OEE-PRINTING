<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard OEE Printing PGG</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header ringkas dengan menu pop up; satu fungsi per tab; ringkasan di atas, rincian di bawah. Palet hijau sage dan abu-abu. */
:root{
  --bg:#edf0ed; --surface:#fafbfa; --surface-2:#e2e8e3; --line:#cdd6cf; --grid:#dee5e0;
  --fg:#16211a; --fg-2:#415046; --fg-3:#687a6e;
  --accent:#2d7a4c; --accent-ink:#ffffff; --accent-soft:#d9eadf;
  --c-prod:#2f8f5b; --c-fail:#d64545; --c-idle:#e0a21a; --c-lr:#5a6fc0; --c-unsch:#8a968e;
  --bad:#c2312f; --bad-soft:#f8dfde; --ok:#1d7a4b; --ok-soft:#d5eedf;
  --heat0:#e8f0ea; --heat1:#2d7a4c; --bd-w1:#b5d8c2; --bd-w2:#c3d6e3; --bd-b1:#dff0e5; --bd-b2:#e1eaf2; --bd-s:#f2f8f4; --bd-s2:#d3e6da; --bd-line:#b4cdbd; --shadow:0 12px 32px rgba(20,40,28,.18);
  --f-display:'Barlow Semi Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d18; --surface-2:#1e2822; --line:#2b3a31; --grid:#222e27;
  --fg:#e6eee8; --fg-2:#b1c0b6; --fg-3:#81938a;
  --accent:#55b97d; --accent-ink:#06150d; --accent-soft:#1c3a2a;
  --c-prod:#3fae72; --c-fail:#e66767; --c-idle:#d9a21a; --c-lr:#8c9be0; --c-unsch:#6f7f75;
  --bad:#ff8785; --bad-soft:#3a1e20; --ok:#4cc79a; --ok-soft:#14322a;
  --heat0:#16231b; --heat1:#4fb77d; --bd-w1:#12301f; --bd-w2:#14293a; --bd-b1:#1a3a29; --bd-b2:#1b3040; --bd-s:#15261d; --bd-s2:#25402f; --bd-line:#2f4d3b; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d18; --surface-2:#1e2822; --line:#2b3a31; --grid:#222e27;
  --fg:#e6eee8; --fg-2:#b1c0b6; --fg-3:#81938a;
  --accent:#55b97d; --accent-ink:#06150d; --accent-soft:#1c3a2a;
  --c-prod:#3fae72; --c-fail:#e66767; --c-idle:#d9a21a; --c-lr:#8c9be0; --c-unsch:#6f7f75;
  --bad:#ff8785; --bad-soft:#3a1e20; --ok:#4cc79a; --ok-soft:#14322a;
  --heat0:#16231b; --heat1:#4fb77d; --bd-w1:#12301f; --bd-w2:#14293a; --bd-b1:#1a3a29; --bd-b2:#1b3040; --bd-s:#15261d; --bd-s2:#25402f; --bd-line:#2f4d3b; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1480px;margin:0 auto}
header.top{position:relative;z-index:30;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:16px 0 10px}
h1{font:600 26px/1.1 var(--f-display);letter-spacing:.01em;margin:0}
.sub{color:var(--fg-3);font-size:12px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:12px var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--fg-2)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:relative}
.menubtn{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:7px 12px 7px 14px;cursor:pointer;text-align:left;min-width:0}
.menubtn .mi{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.menubtn b{font:600 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.menubtn small{font-size:10.5px;opacity:.85;white-space:nowrap}
.menubtn svg{flex:none;transition:transform .15s}
.menubtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(580px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
@media(max-width:560px){.menu{position:static}.pop{grid-template-columns:minmax(0,1fr);left:0;right:0;width:auto}}
.pop[hidden]{display:none}
.prnframe{display:block;width:100%;height:900px;border:0;border-radius:12px;overflow:hidden;background:var(--surface)}
.pop button{background:none;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--fg)}
.pop button:hover{background:var(--surface-2)}
.pop button[aria-current="page"]{background:var(--accent-soft)}
.pop button b{font:600 13px var(--f-body);letter-spacing:.01em}
.pop button[aria-current="page"] b{color:var(--accent)}
.pop button small{font-size:11.5px;color:var(--fg-3)}
main{padding-block:16px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel h2{font:600 16px var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px;color:var(--fg-2)}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media(max-width:900px){.g2,.g-side{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.f .seg button{text-transform:none;letter-spacing:0;font-size:12px;padding:5px 9px}
.f input,.f select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;color:var(--fg);text-transform:none;letter-spacing:0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:6px 10px;cursor:pointer;color:var(--fg-2);font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mcs{display:flex;flex-wrap:wrap;gap:5px;max-width:100%}
.mcs label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font-size:12px;cursor:pointer;background:var(--surface);text-transform:none;letter-spacing:0;color:var(--fg-2)}
.mcs label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.mcs input{accent-color:var(--accent);margin:0}
details.mcbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;flex:1 1 100%}
details.mcbox summary{cursor:pointer;font-size:12px;color:var(--fg-2)}
details.mcbox .mcs{margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3)}
.kpi .v{font:600 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font:12px var(--f-mono);color:var(--fg-3)}
.kpi.bad .v{color:var(--bad)}
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);font-weight:600;color:var(--fg-2);position:sticky;top:0;z-index:2}
td:first-child,th:first-child{text-align:left}
td.num{font-family:var(--f-mono)}
tr.total td{font-weight:600;background:var(--surface-2)}
.tw.tall{max-height:70vh}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:3;background:var(--surface)}
.sticky1 th:first-child{background:var(--surface-2);z-index:4}
.sticky1 tr.total td:first-child{background:var(--surface-2)}
.cell-bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.cell-ok{color:var(--fg)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--fg-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fg-2);margin:6px 0}
svg text{font-family:var(--f-body);fill:var(--fg-2)}
svg .ax{stroke:var(--grid)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:5px;max-width:260px;display:none;white-space:pre-line}
.hint{color:var(--fg-3);font-size:12px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;margin:8px 0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:10px;border-radius:6px;overflow:auto;margin:6px 0}
.hm td{text-align:center;padding:3px 0;min-width:44px;font-family:var(--f-mono);font-size:11.5px;border-right:1px solid var(--surface)}
.hm th{text-align:center;font-size:11px;padding:4px 2px}
.hm td:first-child,.hm td:nth-child(2){text-align:left;padding:3px 8px;min-width:0;font-family:var(--f-body);font-size:12.5px}
.hm.sticky1 td:nth-child(2),.hm.sticky1 th:nth-child(2){position:sticky;left:var(--c1,120px);z-index:3;background:var(--surface)}
.hm th:nth-child(2){background:var(--surface-2);z-index:4}
.hm tr.total td:nth-child(2){background:var(--surface-2)}
.we{color:var(--bad)}

/* board (OEE & PARETO): memakai tema yang sama dengan tab lain; warna khusus hanya batang A, P, Q, OEE */
.board{display:flex;flex-direction:column;gap:18px;min-width:0;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--bd-w1),var(--bd-w2));--surface:var(--bd-s);--surface-2:var(--bd-s2);--line:var(--bd-line)}
.bd-sep{display:none}
.bd-b1,.bd-b2{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.bd-b1{background:var(--bd-b1)}.bd-b2{background:var(--bd-b2)}
.bd-b1{display:grid;grid-template-columns:236px 136px minmax(0,1fr) 250px;gap:16px;align-items:start}
.bd-b2{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
@media(max-width:1150px){.bd-b1{grid-template-columns:236px 136px minmax(0,1fr)}.bd-tables{grid-column:1 / -1;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media(max-width:1000px){.bd-b2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.bd-b1{grid-template-columns:minmax(0,1fr)}.bd-tables{grid-template-columns:minmax(0,1fr)!important}}
.bd-mcbox,.bd-flt,.bd-chartcol,.bd-tables,.bd-parcol,.bd-right{min-width:0}
.bd-h2{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2);background:var(--surface-2);padding:5px 8px;border-radius:5px;margin:12px 0 5px}
.bd-h2.g,.bd-flt .bd-h2:first-child{margin-top:0}
.bd-box{display:grid;gap:4px;text-align:center;font-size:11px;color:var(--fg-3)}
.bd-flt .dti,.bd-flt select{width:100%;min-width:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px}
.bd-btn{display:block;width:100%;margin-top:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:6px 8px;font-weight:500;font-size:12px;cursor:pointer}
.bd-btn.alt{background:var(--surface);color:var(--fg);border-color:var(--line)}
.bd-btn:hover{filter:brightness(1.08)}
.bd-strip{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline;font-size:12px;color:var(--fg-3);padding:0 2px 8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.bd-strip b{color:var(--fg);font-weight:600}
.bd-strip .t{margin-inline:auto;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.bd-chart{width:100%}
.bd-flt .dti{padding:4px 22px 4px 5px;font-size:11.5px}
.bd-mcbox .mcl{width:100%}
.bd-flt .bd-btn{font-size:11px;padding:6px 4px}
.bt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bt th{background:var(--surface-2);color:var(--fg-2);position:sticky;top:0;text-align:left;padding:6px 8px;font-size:11px;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.bt td{padding:4px 8px;border-bottom:1px solid var(--grid);color:var(--fg);text-align:left;white-space:normal;font-variant-numeric:tabular-nums}
.bt tr:last-child td{border-bottom:0}
.bt.k td:last-child{text-align:right;font-family:var(--f-mono);font-size:12px}
.bt td.pk{background:var(--bad-soft);color:var(--bad)}
.bt td.gn{background:var(--ok-soft);color:var(--ok)}
.bt td.r,.bt th.r{text-align:right}
.bt td.wrap{white-space:normal;min-width:110px}
.mut{color:var(--fg-3)}
.bt tr.hl td{font-weight:600}
.bt tr.hl.y td{background:#f2e30c;color:#000}.bt tr.hl.b td{background:#1f78d1;color:#fff}.bt tr.hl.r td{background:#e8352f;color:#fff}
.bt small{color:var(--fg-3);font-size:10.5px;margin-left:4px}
.bd-tables{display:flex;flex-direction:column;gap:12px}
.bt.mcl th.c,.bt.mcl td.c{text-align:center}
.bt.mcl th{font-size:10.5px;padding:4px 6px}
.bt.mcl td{white-space:nowrap;padding:3px 6px;font-size:12px}
.bt.mcl td:first-child{width:26px;text-align:center;color:var(--fg-3)}
.bt.mcl input{accent-color:var(--accent);width:13px;height:13px;margin:0;vertical-align:middle}
.bt.mcl{table-layout:fixed;width:100%}
.bt.mcl th:first-child,.bt.mcl td:first-child{width:34px}
.bt.mcl th:last-child,.bt.mcl td:last-child{width:64px}
.bt.mcl td:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.bt.act td.cat{text-align:center;font-weight:600;font-size:11.5px}
.bt tr.clk{cursor:pointer}.bt tr.clk:hover td{background:var(--accent-soft)}.bt tr.clk.on td{box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.bd-scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.bd-scroll .bt{border:0;border-radius:0}
.bd-scroll.tall{max-height:640px}
.bd-par{overflow-x:auto}
.bd-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--fg-2);margin:6px 0 10px}
.bd-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bd-legend .hint2{margin-left:auto;color:var(--fg-3)}
.bd-act{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface-2);padding:8px 10px;border-radius:6px;font-size:12.5px}
.bd-act b{font-size:11px;letter-spacing:.07em;color:var(--fg-2)}
.bd-act label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.bd-act input{accent-color:var(--accent)}
.bd-total{margin-left:auto;font-size:12px;color:var(--fg-2)}
.bd-total b{font-family:var(--f-mono);color:var(--fg)}
.bd-empty{padding:20px;text-align:center;color:var(--fg-3)}
.bd-card{background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:8px;padding:14px}
.bd-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bd-card h3{margin:0;font:600 16px var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.bd-card h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-2)}
.bd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bd-chips span{background:var(--surface-2);padding:2px 10px;border-radius:99px;font-size:12px;color:var(--fg-2)}
.bd-two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px}
@media(max-width:900px){.bd-two{grid-template-columns:minmax(0,1fr)}}
.bd-two .bd-scroll{max-height:340px}
.flog td.wrap{max-width:360px}
h3{font:600 14px var(--f-body);margin:14px 0 6px}
ul.clean{margin:4px 0;padding-left:18px}
@media(prefers-reduced-motion:no-preference){.kpi,.panel{transition:border-color .15s}}

.apwrap{padding:14px}
.apban{text-align:center;font:600 26px/1.1 'Barlow Semi Condensed',sans-serif;letter-spacing:.02em;padding:10px;background:var(--accent-soft);border-radius:6px;margin-bottom:14px;color:var(--fg)}
.ap2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.ap2{grid-template-columns:1fr}}
.apbox{min-width:0;overflow-x:auto}
.aptitle{margin:0 0 6px;text-align:center;font:600 16px 'Barlow Semi Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.aptab{width:100%;border-collapse:collapse;border:2px solid var(--fg);font-size:13px;background:var(--surface)}
.aptab th,.aptab td{border:1px solid var(--fg-3);padding:5px 8px;text-align:center}
.aptab th{font:600 14px 'Barlow Semi Condensed',sans-serif;color:#111}
.aptab .apm{background:var(--accent-soft);color:var(--fg);width:30%}
.aptab .apd{background:var(--surface-2);color:var(--fg);font-weight:500}
.aptab .gsep{border-left:3px solid var(--fg)}
.aptab .hA,.aptab .tA{background:#f2e30c;color:#111}
.aptab .hP,.aptab .tP{background:#1f78d1;color:#fff}
.aptab .hQ,.aptab .tQ{background:#e8352f;color:#fff}
.aptab .hO,.aptab .tO{background:#2db35d;color:#111}
.aptab tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.aptab tbody tr:nth-child(even) td{background:var(--surface)}
.aptab tbody td.cell-bad{background:var(--bad-soft)!important;color:var(--bad);font-weight:700}
.aptab .apn{text-align:left;font-weight:700;white-space:nowrap}
.aptab tfoot td{font-weight:700;font-size:14px;border-top:2px solid var(--fg)}
.aptab tfoot .apn{background:var(--accent-soft)}

.dt{position:relative;display:inline-flex;align-items:center}
.dt .dti{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 8px;font:13px var(--f-mono);color:var(--fg);width:118px;min-width:0}
.bd-flt .dt{display:flex;width:100%}.bd-flt .dt .dti{width:100%}
.dtb{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--fg-3);padding:3px;cursor:pointer;display:flex}
.dtb:hover{color:var(--accent)}
.dtp{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
/* OEE SHIFT */
.shf{border-collapse:separate;border-spacing:0;font-size:12px;background:var(--surface)}
.shf th,.shf td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}
.shf thead th{position:sticky;z-index:3;color:#111;font:600 12.5px 'Barlow Semi Condensed',sans-serif}
.shf thead tr:first-child th{top:0;background:var(--surface-2);color:var(--fg)}
.shf thead tr:nth-child(2) th{top:var(--h1,30px)}
.shf .hA{background:#f2e30c}.shf .hP{background:#1f78d1;color:#fff!important}.shf .hQ{background:#e8352f;color:#fff!important}.shf .hO{background:#2db35d}
.shf td.num{font-family:var(--f-mono);min-width:62px}
.shf td.m{background:#2e4a38;color:#fff;font:600 14px 'Barlow Semi Condensed',sans-serif;text-align:center;min-width:118px;position:sticky;left:0;z-index:2}
.shf thead th.m{background:var(--accent-soft);color:var(--fg);position:sticky;left:0;z-index:5;min-width:118px}
.shf td.s,.shf thead th.s{position:sticky;left:118px;z-index:2;background:var(--surface);text-align:left;font-weight:500;min-width:66px}
.shf thead th.s{z-index:5;background:var(--accent-soft);color:var(--fg)}
.shf tr.tot td{font-weight:700;background:var(--surface-2)}
.shf tr.tot td.s{background:var(--surface-2)}
.shf tr.mend td{border-bottom:2px solid var(--fg-2)}
.shf td.hi{background:var(--bad-soft)!important;color:var(--bad)}
.fa2{display:grid;gap:22px}
.aptab.fat .hG{background:var(--surface-2);color:var(--fg);font-size:12px;white-space:normal}
.aptab.fat td.num{font-family:var(--f-mono);white-space:nowrap}
.aptab.fat tfoot td.num{background:var(--accent-soft)}

.kes h2{margin-top:0}
.ksum{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.5}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.kt .lb{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}.kt .lb i{display:block;height:100%}
.kt td.num{font-family:var(--f-mono)}
.kh{margin:20px 0 10px;font:600 20px 'Barlow Semi Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.kgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.kc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c-idle);border-radius:10px;padding:14px;min-width:0}
.kc.hi{border-left-color:var(--bad)}.kc.md{border-left-color:var(--c-idle)}.kc.lo{border-left-color:var(--accent)}
.kc header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.kc h3{margin:0;font:600 20px 'Barlow Semi Condensed',sans-serif}
.kb{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.kb.hi{background:var(--bad-soft);color:var(--bad)}.kb.md{background:#fbecc8;color:#7a5600}.kb.lo{background:var(--accent-soft);color:var(--accent)}
.ko{margin-left:auto;font:600 15px var(--f-mono)}.ko small{font:400 11px var(--f-body);color:var(--fg-3)}
.kapq{display:flex;gap:6px;margin:8px 0;font:12px var(--f-mono)}.kapq span{padding:2px 8px;border-radius:5px;color:#111}
.kapq .a{background:#f2e30c}.kapq .p{background:#1f78d1;color:#fff}.kapq .q{background:#e8352f;color:#fff}
.kcs{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.kcs h4{margin:0 0 4px;font-size:14px}.kcs h4 small{color:var(--bad);font-weight:500}
.kev{margin:0 0 6px;padding-left:18px;font-size:13px;color:var(--fg-2);display:grid;gap:2px}
.kact{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:6px 10px}
.kact ol{margin:4px 0 0;padding-left:18px;display:grid;gap:3px}
.kc footer{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:12px;color:var(--fg-2);display:grid;gap:3px}
.kdep{margin:0;padding-left:20px;display:grid;gap:12px}.kdep small{color:var(--bad)}.kdep li>div{margin-top:3px;font-size:13.5px}

.da3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.dabox h3{margin:0 0 6px;font:600 16px 'Barlow Semi Condensed',sans-serif;color:var(--accent)}
.dat{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dat th{padding:6px 8px;text-align:left}.dat th span{background:var(--accent-soft);color:var(--accent);font:500 11px var(--f-body);padding:2px 8px;border-radius:5px}
.dat th:not(:first-child){text-align:right}
.dat td{padding:7px 8px;border-top:1px solid var(--line)}.dat td:first-child{font-weight:600}
.dat td.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.dat tr.hl td{background:var(--accent-soft)}.dat tr.warn td.num{color:var(--bad)}
.kbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kcopied{font-size:12px;color:var(--ok)}

body.locked #gate{display:flex}
#gate::before{content:"";position:absolute;inset:0;background:rgba(10,28,18,.62)}
#gate .gc{position:relative;width:min(100%,430px);background:#fff;border-radius:16px;padding:30px 36px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);color:#16211a}
#gate .gl{display:block;width:92px;height:auto;margin:0 auto 14px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#gate h2{margin:0 0 4px;font:600 21px/1.25 'IBM Plex Sans',system-ui,sans-serif;color:#16311f}
#gate p{margin:0 0 18px;font-size:14px;color:#5c6b61}
#gate input{display:block;width:100%;box-sizing:border-box;padding:13px 14px;font:16px 'IBM Plex Sans',system-ui,sans-serif;border:1px solid #cdd6cf;border-radius:10px;background:#fff;color:#16211a;outline:none}
#gate input:focus{border-color:#2d7a4c;box-shadow:0 0 0 3px rgba(45,122,76,.2)}
#gate button{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#2d6a45;color:#fff;font:600 15px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer}
#gate button:hover{background:#245a3a}
#gate .ge{min-height:20px;margin-top:10px;font-size:13px;color:#c2312f}
#gate .gc.shake{animation:gsh .35s}
@keyframes gsh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.aptab.tgt td.tgc{padding:3px 4px}
.aptab.tgt input.tg{width:62px;padding:4px 4px;text-align:right;font:13px var(--f-mono);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:5px}
.aptab.tgt input.tg:focus{outline:2px solid var(--accent);outline-offset:-1px}
.aptab.tgt td.num{font-family:var(--f-mono);white-space:nowrap}
.aptab.tgt td.ok{color:var(--ok);font-weight:600}.aptab.tgt td.no{color:var(--bad);font-weight:600}
.aptab.tgt thead th{font-size:12.5px}
.aptab.tgt tfoot td{border-top:2px solid var(--fg)}
.aptab.tgt tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}

.damc{position:relative;display:inline-block}
.damc summary{cursor:pointer;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 10px;font-size:13px;position:relative;user-select:none}
.damc summary::-webkit-details-marker{display:none}
.damc summary::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:2px solid var(--fg-3);border-bottom:2px solid var(--fg-3);transform:translateY(-70%) rotate(45deg)}
.damcb{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:210px;max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px;display:grid;gap:2px}
.damcb label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 4px;border-radius:4px;cursor:pointer}.damcb label:hover{background:var(--accent-soft)}
.damct{display:flex;gap:6px;margin-bottom:4px}.damct .btn{padding:3px 8px;font-size:12px}

.trleg{display:flex;gap:6px;flex-wrap:wrap}
.trl{border:1px solid var(--c);color:var(--fg);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.trl.on{background:var(--c);color:#111;font-weight:600}
span.trl{cursor:default}
.trl.on[style*="1f78d1"],.trl.on[style*="e8352f"],.trl.on[style*="accent"]{color:#fff}
.trch{width:100%}
.aptab.trt{width:100%}
.aptab.trt td.num{font-family:var(--f-mono)}
.aptab.trt tr.cur td{font-weight:700}
.aptab.trt tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.aptab.trt tbody td.cell-bad{background:var(--bad-soft)!important}

.trm{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:6px}
.aptab.trx{border:0;border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
.trx th,.trx td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.trx thead th{position:sticky;top:0;z-index:3;background:var(--accent);color:#fff;font:600 12.5px 'Barlow Semi Condensed',sans-serif;text-align:center}
.trx .no{width:40px;text-align:center;position:sticky;left:0;z-index:2;background:var(--surface)}
.trx .ds{min-width:190px;text-align:left;position:sticky;left:40px;z-index:2;background:var(--surface);font-weight:600}
.trx .un{width:56px;text-align:center;position:sticky;left:230px;z-index:2;background:var(--surface)}
.trx thead .no,.trx thead .ds,.trx thead .un{z-index:5;background:var(--accent)}
.trx td.num{text-align:right;font-family:var(--f-mono);min-width:64px}.trx td.pc{min-width:56px;color:var(--fg-2)}
.trx tr.sec td{font-weight:700;font-size:12px;letter-spacing:.03em;position:static}
.trx tr.s1 td{background:var(--surface-2)}
.trx tr.s2 td{background:color-mix(in srgb,#5a6fc0 26%,var(--surface))}
.trx tr.s3 td{background:color-mix(in srgb,#e0a21a 30%,var(--surface))}
.trx tr.m td.ds{font:700 15px 'Barlow Semi Condensed',sans-serif;color:#111}
.trx tr.ma td.no,.trx tr.ma td.ds,.trx tr.ma td.un{background:#f2e30c;color:#111}
.trx tr.mp td.no,.trx tr.mp td.ds,.trx tr.mp td.un{background:#1b2f6b;color:#fff}
.trx tr.mq td.no,.trx tr.mq td.ds,.trx tr.mq td.un{background:#e8352f;color:#fff}
.trx tr.mo td.no,.trx tr.mo td.ds,.trx tr.mo td.un{background:#2db35d;color:#111}
.trx tr.mp td.ds,.trx tr.mq td.ds{color:#fff}.trx tr.mo td.ds{color:#111}
.trx tr.m td.num{font-size:13px}.trx td.bad{background:var(--bad-soft)!important;color:var(--bad);font-weight:600}
.trx tr.z td:not(.no):not(.ds):not(.un){background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.trx tr.z td.no,.trx tr.z td.ds,.trx tr.z td.un{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.trx tr.b td{font-weight:700}

/* ===== LAPORAN OEE ===== */
.lap-sec{margin-bottom:22px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lap-h{font:700 22px var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;line-height:1.15;color:var(--fg)}
.lap-h small{display:block;font-weight:600;font-size:.82em;color:var(--fg-2)}
.lap-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.lap-p{padding:12px;display:flex;flex-direction:column;min-width:0}
.lap-oee{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;align-items:stretch}
.lap-oee .bd-chart{display:flex;align-items:center}
.lap-tb{display:flex;flex-direction:column;gap:8px}
.lap-tb .bt{font-size:11px}.lap-tb .bt td{padding:3px 6px}
.lap-p .bd-par{flex:1;display:flex;align-items:center;overflow:visible}
.lap-p .bd-par svg{min-width:0!important;width:100%;overflow:visible}
.lap-p .bd-legend{margin-top:auto}
.lap-sec g[data-act]{cursor:default!important}
.lap-ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:14px}
@media(max-width:1000px){.lap-grid{grid-template-columns:minmax(0,1fr)}}

<script>
(function(){

const BASE=Date.UTC(2026,0,1);
const toDay=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-BASE)/864e5);
const dayDate=n=>new Date(BASE+n*864e5);
const p2=n=>String(n).padStart(2,'0');
const fmtD=n=>{const d=dayDate(n);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()};

const fromIso=s=>{s=(s||'').trim();let m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(m)return toDay(+m[1],+m[2],+m[3]);
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31)return null;
  const n=toDay(y,mo,d),c=dayDate(n);return c.getUTCMonth()+1===mo?n:null};
const CAL='<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 7h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>';

/* ---------- master (KAMUS / KONTROL) ---------- */
const MASTER=['MC FLAT PRINT 1','MC FLAT PRINT 2','MC FLAT PRINT 3','MC FLAT PRINT 4','MC FLAT PRINT 5','MC FLAT PRINT 6','MC FLAT PRINT 7','MC STEAMER 2','MC STEAMER 3','MC STEAMER 4','WASHING TEXFAB','WASHING TEXFAB 2','WASHING TEXFAB 3'];
const MASTER_OFF=new Set([]);
/* nama mesin baku (urutan tampil) + penyamaan variasi penulisan dari sheet */
const MC_CANON=MASTER.slice();
function mcKey(s){
  s=String(s==null?'':s).toLowerCase().trim().replace(/\s+/g,' ').replace(/^mc[\s._-]*/,'');
  s=s.replace(/^flat[\s._-]*print/,'flatprint').replace(/^steam[a-z]*/,'steamer').replace(/^wash[a-z]*/,'washing');

}
const MC_MAP=(()=>{const o={};MC_CANON.concat(MASTER).forEach(n=>{o[mcKey(n)]=n});return o})();
const canonMc=raw=>{const s=String(raw==null?'':raw).trim().replace(/\s+/g,' ');return MC_MAP[mcKey(s)]||s};
let machines=[]; // {name, on}
let rows=[];

function initMachines(){
  const saved=store.get('oee.mc',null);
  const seen=new Set(rows.map(r=>r.mc));
  const names=MASTER.slice(); seen.forEach(n=>{if(n&&!names.includes(n))names.push(n)});
  machines=names.map(n=>({name:n,on:saved&&n in saved?!!saved[n]:!MASTER_OFF.has(n)}));
}
const activeMcs=()=>machines.filter(m=>m.on).map(m=>m.name);
function saveMachines(){const o={};machines.forEach(m=>o[m.name]=m.on);store.set('oee.mc',o)}

/* ---------- data ---------- */
function loadSnapshot(){
  const s=JSON.parse($('#snap').textContent), D=s.dicts;
  rows=s.rows.map(r=>({d:r[0],mc:canonMc(D.mc[r[1]]),sh:r[2],tm:D.team[r[3]],act:titleCase(D.act[r[4]]),cat:D.cat[r[5]],len:r[6],pr:D.product[r[7]],sp:r[8],q:r[9],st:r[10],tg:r[11],cp:D.cp[r[12]],fq:r[13],lb:D.lb[r[14]],ds:D.ds[r[15]]}));
  finishLoad();
}
function finishLoad(){
  rows.sort((a,b)=>a.d-b.d);
  initMachines();
  if(!rows.length){const n=new Date(),td=toDay(n.getFullYear(),n.getMonth()+1,n.getDate());meta.min=meta.max=td;$('#dataChip').textContent='menunggu data Google Sheets…';return}
  const ds=rows.map(r=>r.d); const mn=Math.min(...ds), mx=Math.max(...ds);

  $('#dataChip').textContent=rows.length.toLocaleString('id-ID')+' baris · '+fmtD(mn)+' – '+fmtD(mx);
}
/* accumulators */
const acc=()=>({tot:0,un:0,pr:0,fa:0,id:0,lr:0,tg:0,im:0,ac:0,qa:0,qb:0,qc:0,fc:0,n:0});
function add(a,r){
  a.n++; a.tot+=r.len;
  switch(r.cat){
    case 'Production':a.pr+=r.len;a.tg+=r.tg;a.im+=r.sp*r.len;a.ac+=r.q;
      if(r.cp==='A')a.qa+=r.q;else if(r.cp==='B')a.qb+=r.q;else if(r.cp==='C')a.qc+=r.q;else a.qa+=r.q;break;
    case 'Failure':a.fa+=r.len;a.fc+=r.fq;break;
    case 'Idle':a.id+=r.len;break;
    case 'Line Restraint':a.lr+=r.len;break;
    case 'Unscheduled':a.un+=r.len;break;
  }
}
function merge(a,b){for(const k in a)a[k]+=b[k];return a}
function fin(a){
  const load=a.tot-a.un;
  const A=load>0?a.pr/load:0, P=a.tg>0?a.ac/a.tg:0, Q=a.ac>0?a.qa/a.ac:0;
  return Object.assign({},a,{load,A,P,Q,O:A*P*Q,
    mtbf:a.fc>0?load/a.fc:0, mttr:a.fc>0?a.fa/a.fc:0, ffr:load>0?a.fc/load:0, fr:load>0?a.fa/load:0});
}
function selRows(f){
  const set=f.mcs&&new Set(f.mcs);
  return rows.filter(r=>r.d>=f.from&&r.d<=f.to&&(!set||set.has(r.mc))&&(f.shift==null||f.shift<0||r.sh===f.shift)&&(!f.team||r.tm===f.team));
}
function byMc(f){ // -> Map mc -> acc
  const m=new Map(); for(const r of selRows(f)){let a=m.get(r.mc);if(!a){a=acc();m.set(r.mc,a)}add(a,r)} return m;
}
function totalOf(f){const a=acc();for(const r of selRows(f))add(a,r);return fin(a)}

/* ---------- tooltip & charts ---------- */

function hbar(items,{max=1,fmt=pct1,threshold=null,w=560,label=130}={}){
  const rh=22,H=items.length*rh+6, bw=w-label-70;
  let s=`<svg viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="Grafik batang">`;
  if(threshold!=null){const x=label+bw*threshold/max;s+=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--bad)" stroke-dasharray="3 3"/>`}
  items.forEach((it,i)=>{
    const y=i*rh+3, len=Math.max(0,Math.min(1,it.v/max))*bw;
    const bad=threshold!=null&&it.v<threshold;
    s+=`<g data-tip="${esc(it.name)}\n${esc(it.tip||fmt(it.v))}"><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>`+
      `<text x="${label-8}" y="${y+15}" text-anchor="end" font-size="12">${esc(it.name)}</text>`+
      `<rect x="${label}" y="${y+4}" width="${bw}" height="${rh-8}" rx="2" fill="var(--grid)"/>`+
      `<rect x="${label}" y="${y+4}" width="${len}" height="${rh-8}" rx="2" fill="${bad?'var(--c-fail)':'var(--c-prod)'}"/>`+
      `<text x="${label+bw+6}" y="${y+15}" font-size="12" font-family="var(--f-mono)" ${bad?'style="fill:var(--bad);font-weight:600"':''}>${fmt(it.v)}</text></g>`;
  });
  return s+'</svg>';
}
function waterfall(steps,{w=560,unit='',fmt=fmtN}={}){
  // steps: {name,v,kind:'total'|'delta',color}; delta v is signed (end - start)
  const rh=30,pad=4,label=150,bw=w-label-100,H=steps.length*rh+pad*2;
  const top=Math.max(...steps.filter(s=>s.kind==='total').map(s=>s.v),1);
  const sc=v=>bw*Math.max(0,v)/top; let run=0;
  let s=`<svg viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="Waterfall">`;
  steps.forEach((st,i)=>{
    const y=pad+i*rh; let a,b;
    if(st.kind==='total'){a=0;b=st.v;run=st.v}else{a=run;b=run+st.v;run=b}
    const lo=Math.min(a,b),hi=Math.max(a,b);
    const x=label+sc(lo), ww=Math.max(1.5,sc(hi)-sc(lo));
    const sg=st.kind==='delta'?(st.v<0?'\u2212':'+'):'';
    s+=`<g data-tip="${esc(st.name)}\n${sg}${fmt(Math.abs(st.v))} ${unit}"><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>`+
      `<text x="${label-8}" y="${y+19}" text-anchor="end" font-size="12">${esc(st.name)}</text>`+
      `<rect x="${x}" y="${y+5}" width="${ww}" height="${rh-12}" rx="2" fill="${st.color}"/>`+
      `<text x="${label+sc(hi)+6}" y="${y+19}" font-size="12" font-family="var(--f-mono)">${sg}${fmt(Math.abs(st.v))}</text></g>`;
  });

}
function pareto(items,{w=640,h=300}={}){
  if(!items.length)return '<p class="hint">Tidak ada data pada filter ini.</p>';
  const tot=items.reduce((a,b)=>a+b.v,0), L=44,R=40,T=14,B=96, pw=w-L-R, ph=h-T-B;

      `<rect x="${x}" y="${y}" width="${bw*.72}" height="${bh}" rx="2" fill="${catColor(it.cat)}"/></g>`+

  pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--surface)" stroke="var(--fg-2)" stroke-width="1.4"/>`);
  return s+'</svg>';
}
const legend=cats=>'<div class="legend">'+cats.map(c=>`<span><i class="dot" style="background:${catColor(c)}"></i>${c}</span>`).join('')+'</div>';

/* ---------- shared filter component ---------- */
function defRange(){const e=meta.max;return {from:e-13,to:e}}
function mkFilter(key,opts={}){
  const st=Object.assign({from:null,to:null,shift:-1,team:'',mcs:null,cats:['Idle','Failure','Line Restraint']},opts.init||{});

    get(){ensure();const a=activeMcs(); const sel=st.mcs?st.mcs.filter(x=>a.includes(x)):a; return {from:st.from,to:st.to,shift:st.shift,team:st.team,mcs:sel}},

      </div>`},
    bind(root,rerender){

function kesText(root,full){
  const T=n=>(n&&n.innerText||'').replace(/\s+/g,' ').trim();
  const out=[], per=T(root.querySelector('.kes h2')).replace(/^Kesimpulan\s*/i,'');
  out.push('LAPORAN OEE DEPT PRINTING PGG',per.charAt(0).toUpperCase()+per.slice(1),'');
  out.push('KESIMPULAN');
  root.querySelectorAll('.ksum li').forEach(li=>out.push('- '+T(li)));
  const rows=[...root.querySelectorAll('.kt tbody tr, .kt tfoot tr')];
  if(rows.length){out.push('','PENYEBAB OEE TURUN (poin dari 100%)');rows.forEach(tr=>{const c=[...tr.children].slice(0,2).map(T);out.push('- '+c[0]+': '+c[1])})}
  const dep=[...root.querySelectorAll('.kdep > li')];
  if(dep.length){out.push('','ACTION PLAN PRIORITAS DEPARTEMEN');dep.forEach((li,i)=>{const b=T(li.querySelector('b')),sm=T(li.querySelector('small')),ds=[...li.querySelectorAll(':scope > div')].map(T);out.push((i+1)+'. '+b+' ('+sm+')');ds.forEach(d=>out.push('   '+d))})}
  if(full){
    const cards=[...root.querySelectorAll('.kc')];
    if(cards.length){out.push('','MESIN YANG PERLU PERHATIAN KHUSUS');
      cards.forEach(c=>{
        out.push('',T(c.querySelector('h3')).toUpperCase()+' | '+T(c.querySelector('.kb'))+' | '+T(c.querySelector('.ko')),'  '+T(c.querySelector('.kapq')));
        c.querySelectorAll('.kcs').forEach(s=>{
          out.push('  '+T(s.querySelector('h4')));
          s.querySelectorAll('.kev li').forEach(e=>out.push('    - '+T(e)));
          const a=[...s.querySelectorAll('.kact li')];if(a.length){out.push('    Action plan:');a.forEach((x,i)=>out.push('      '+(i+1)+'. '+T(x)))}
        });
        c.querySelectorAll('footer span').forEach(f=>out.push('  '+T(f)));
      })}
    const g=root.querySelector('.kes:last-of-type p');
  }
  out.push('','Dibuat otomatis dari dashboard OEE Printing PGG. Rekomendasi bersifat saran awal.');
  return out.join('\n');
}

function kesFilters(){

}
function kesBind(root){
  const set=(k,v)=>{if(v!=null){kes[k]=v;if(kes.from>kes.to){if(k==='from')kes.to=v;else kes.from=v}render()}};
  $('#kFrom',root).onchange=e=>set('from',fromIso(e.target.value));
  $('#kTo',root).onchange=e=>set('to',fromIso(e.target.value));
  $('#kPre',root).onclick=e=>{const b=e.target.closest('button');if(b){const p=preset(b.dataset.k);kes.from=p.from;kes.to=p.to;render()}};
  const done=ok=>{const e=$('#kOk');if(e){e.textContent=ok?'Tersalin ke clipboard':'Gagal menyalin, blok teks manual';e.style.color=ok?'':'var(--bad)';setTimeout(()=>{if(e)e.textContent=''},3500)}};
  const cp=async full=>{const t=kesText(root,full);try{await navigator.clipboard.writeText(t);done(true)}catch(_){try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();done(ok)}catch(__){done(false)}}};
  const bs=$('#kCopyS',root),bf=$('#kCopyF',root);if(bs)bs.onclick=()=>cp(false);if(bf)bf.onclick=()=>cp(true);
  $('#kTgt',root).onchange=e=>{kes.tgt=Math.max(1,Math.min(100,+e.target.value||85));store.set('oee.tgt',kes.tgt);render()};
}

const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function trendData(mcs){
  const set=new Set(mcs),M=new Map(),g=trF.g;
  const lo=trF.from!=null?trF.from:-Infinity, hi=Math.min(trF.to!=null?trF.to:Infinity,meta.max);
  const keyOf=d=>{if(g==='D')return d;if(g==='W')return d-((dayDate(d).getUTCDay()+6)%7);const x=dayDate(d);return x.getUTCFullYear()*12+x.getUTCMonth()};
  for(const r of rows){if(!set.has(r.mc)||r.d<lo||r.d>hi)continue;const k=keyOf(r.d);let a=M.get(k);if(!a){a=acc();a.fm=new Map();a.am=new Map();a.pm=new Map();M.set(k,a)}add(a,r);if(r.cat==='Production'){const pn=r.pr||'(tanpa produk)';let o=a.pm.get(pn);if(!o){o={pr:0,tg:0,ac:0};a.pm.set(pn,o)}o.pr+=r.len;o.tg+=r.tg;o.ac+=r.q}if(r.cat==='Failure')a.fm.set(r.act,(a.fm.get(r.act)||0)+r.len);if(r.cat!=='Unscheduled'){const q=r.cat+'\t'+r.act;a.am.set(q,(a.am.get(q)||0)+r.len)}}
  const yy=x=>String(x.getUTCFullYear()).slice(2), fd=d=>{const x=dayDate(d);return p2(x.getUTCDate())+'-'+MON[x.getUTCMonth()]+'-'+yy(x)};
  return [...M].sort((a,b)=>a[0]-b[0]).map(([k,a])=>{const f=fin(a);let s,e,label,full;
    if(g==='M'){const y=Math.floor(k/12),m=k%12;s=toDay(y,m+1,1);e=toDay(y,m+1,new Date(Date.UTC(y,m+1,0)).getUTCDate());label=MON[m]+"'"+String(y).slice(2)}
    else if(g==='W'){s=k;e=k+6;const x=dayDate(s);label=p2(x.getUTCDate())+' '+MON[x.getUTCMonth()]}
    else{s=e=k;const x=dayDate(k);label=p2(x.getUTCDate())+'/'+p2(x.getUTCMonth()+1)}
    const es=Math.max(s,trF.from!=null?trF.from:s), ee=Math.min(e,hi), partial=(es>s||ee<e);
    if(g==='M')full=partial?`${p2(dayDate(es).getUTCDate())} s/d ${fd(ee)}`:label;
    else if(g==='W')full=fd(es)+' s/d '+fd(ee);
    else full=fd(k);
    return {k,f,fm:a.fm,am:a.am,pm:a.pm,label,full,partial,load:f.load}}).filter(x=>x.load>0);
}
function trendChart(pts,tgt){
  const w=920,h=360,L=46,R=24,Tp=30,B=44,pw=w-L-R,ph=h-Tp-B, n=pts.length;
  const x=i=>L+pw*(n===1?.5:i/(n-1)), y=v=>Tp+ph*(1-Math.max(0,Math.min(1,v)));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Grafik tren OEE">`;
  for(let g=0;g<=5;g++){const v=g/5;s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--fg-3)">${g*20}%</text>`}
  if(tgt)s+=`<line x1="${L}" x2="${w-R}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--bad)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${w-R}" y="${y(tgt)-6}" text-anchor="end" font-size="11" style="fill:var(--bad)">Target ${(tgt*100).toFixed(0)}%</text>`;
  const stp=Math.max(1,Math.ceil(n/12)), vst=n>16?Math.ceil(n/10):1;
  pts.forEach((p,i)=>{if(i%stp)return;s+=`<text x="${x(i)}" y="${h-14}" text-anchor="middle" font-size="11.5" style="fill:var(--fg-2)">${esc(p.partial?p.label+'*':p.label)}</text>`});
  const series=[['O','OEE','var(--accent)',true],['A','Availability','#d9c400',trShow.A],['P','Performance','#1f78d1',trShow.P],['Q','Quality','#e8352f',trShow.Q]];
  series.forEach(([k,nm,c,on])=>{ if(!on)return;
    const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.f[k]).toFixed(1)).join(' ');
    s+=`<path d="${path}" fill="none" stroke="${c}" stroke-width="${k==='O'?3:2}" stroke-linejoin="round"/>`;

  return s+'</svg>';

  const tr=(lbl,fn,tt,cls)=>`<tr class="${cls||''}"><td class="apn">${lbl}</td>${pts.map(p=>cell(fn(p),p.load)).join('')}${cell(tt,gl)}</tr>`;

  }

}

function lapPeriod(f,t){const a=dayDate(f),b=dayDate(t),ya=a.getUTCFullYear(),yb=b.getUTCFullYear(),ma=a.getUTCMonth(),mb=b.getUTCMonth();

function lapSection(title,f){

      <table class="bt k"><tbody>${row2('Target output',fmtN(T.tg))}${row2('Speed loss',fmtN(T.tg-T.im),'pk')}<tr><td>Imposed Output <small>${pct(T.tg?T.im/T.tg:0)}</small></td><td>${fmtN(T.im)}</td></tr>${row2('Minor stops',fmtN(T.im-T.ac),'pk')}${row2('Actual output',fmtN(T.ac))}<tr class="hl b"><td>Performance Rate</td><td>${pct(T.P)}</td></tr></tbody></table>
      <table class="bt k"><tbody>${row2('Actual output',fmtN(T.ac))}${row2('Product A',fmtN(T.qa))}${row2('Product B',fmtN(T.qb),'pk')}${row2('Product C',fmtN(T.qc),'gn')}<tr class="hl r"><td>Quality Rate</td><td>${pct(T.Q)}</td></tr></tbody></table>

/* ---------- file parsing ---------- */
const HDR={date:['date','tanggal','tgl'],mc:['machine','mesin','mc','nama mesin','machine name','nama machine'],sh:['shift type','shift'],tm:['team','group'],act:['activity','aktivitas'],cat:['category act','kategori act','category activity','kategori aktivitas','cat act','category','kategori'],len:['length','menit'],fq:['freq','frekuensi'],pr:['product','produk'],sp:['speed'],q:['quantity','qty'],st:['standard'],tg:['target'],cp:['category product','kategori produk'],lb:['logbook'],ds:['descripton','description','keterangan']};
function pnum(v){
  if(v==null||v==='')return 0; if(typeof v==='number')return v;
  let s=String(v).trim().replace(/\s/g,''); if(!s)return 0;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function pdate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return toDay(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){const ms=Math.round((v-25569)*864e5);const d=new Date(ms);return toDay(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
  const m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(String(v).trim()); if(m)return toDay(+m[3],+m[2],+m[1]);
  const i=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v).trim()); if(i)return toDay(+i[1],+i[2],+i[3]);
  return null;
}
function msg(t,bad){const el=$('#loadMsg');if(el){el.style.display='block';el.textContent=t;el.style.borderLeftColor=bad?'var(--bad)':'var(--accent)'}}
function parseAoa(aoa){
      // find header row
      const nh=c=>String(c).trim().toLowerCase().replace(/\s+/g,' ');
       let hi=aoa.findIndex(r=>r.some(c=>HDR.mc.includes(nh(c)))&&r.some(c=>HDR.date.includes(nh(c))));
      if(hi<0)throw new Error('Judul kolom DATE dan MACHINE tidak ditemukan. Pastikan file berasal dari tab INPUT DATA.');
      const hdr=aoa[hi].map(nh), ix={};
      for(const k in HDR){for(const nm of HDR[k]){const i=hdr.indexOf(nm);if(i>=0){ix[k]=i;break}}}
      if(ix.act==null||ix.len==null)throw new Error('Kolom ACTIVITY atau LENGTH tidak ada.');
      const out=[];let skipped=0;
      for(let i=hi+1;i<aoa.length;i++){
        const r=aoa[i]; const act=String(r[ix.act]??'').trim(); if(!act)continue;
        const d=pdate(r[ix.date]); if(d==null){skipped++;continue}
        let cat=String(r[ix.cat]??'').trim(); const cl=cat.toLowerCase();
        cat=CATS.find(c=>c.toLowerCase()===cl)||cat;
        const sh=SHIFTS.indexOf(String(r[ix.sh]??'').trim().toUpperCase());
        const g=k=>ix[k]==null?'':r[ix[k]];
        out.push({d,mc:canonMc(g('mc')),sh,tm:String(g('tm')).trim(),act:titleCase(act),cat,len:pnum(g('len')),fq:ix.fq==null?1:pnum(g('fq')),pr:String(g('pr')).trim(),sp:pnum(g('sp')),q:pnum(g('q')),st:pnum(g('st')),tg:pnum(g('tg')),cp:String(g('cp')).trim().toUpperCase(),lb:String(g('lb')).trim(),ds:String(g('ds')).trim()});
      }
      if(!out.length)throw new Error('Tidak ada baris aktivitas yang terbaca.');
      return {out,skipped};
}

  }catch(e){
    const onClaude=/claude\.(ai|com)|anthropic/i.test(location.hostname);
    setStat('Gagal mengambil data langsung ('+e.message+'). Memakai salinan tertanam. '+(onClaude?'Halaman di claude.ai tidak boleh mengakses Google; buka dari GitHub Pages.':'Periksa Web App Apps Script: akses harus "Anyone" dan sudah dideploy ulang.'),true);
  }finally{liveBusy=false;const b=$('#liveRef');if(b){b.disabled=false;b.textContent='Refresh data'}}
}
function setAuto(){clearInterval(liveTimer);if(store.get('oee.auto',true)&&liveUrl())liveTimer=setInterval(()=>{if(!document.hidden)liveLoad(false)},300000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&liveUrl()&&store.get('oee.auto',true)&&Date.now()-liveAt>60000)liveLoad(false)});
/* ===== KAMUS & KONTROL ===== */
views.kamus=function(root){
  const prods=new Map();rows.forEach(r=>{if(r.pr)prods.set(r.pr,(prods.get(r.pr)||0)+1)});
  const acts=new Map();rows.forEach(r=>{const k=r.act;if(!acts.has(k))acts.set(k,r.cat)});
  root.innerHTML=`<div class="grid g-side">
   <div class="panel"><h2>Kontrol mesin (YES / NO)</h2>
     <p class="hint">Mesin yang dicentang dipakai di semua tab. Pilihan tersimpan di browser ini.</p>
     <div class="mcs" style="margin:8px 0">${machines.map(m=>`<label><input type="checkbox" data-mc="${esc(m.name)}" ${m.on?'checked':''}>${esc(m.name)}</label>`).join('')}</div>
     <div class="chip">${machines.filter(m=>m.on).length} mesin aktif dari ${machines.length}</div>
     <h3>Jumlah baris per produk</h3>
     <div class="tw"><table><thead><tr><th>Produk</th><th>Baris</th></tr></thead><tbody>${[...prods].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fmtN(v)}</td></tr>`).join('')}</tbody></table></div>
   </div>
   <div class="panel"><h2>Kamus & rumus</h2>
     <h3>Kategori aktivitas</h3>
     <div class="tw"><table><thead><tr><th>Kategori</th><th style="text-align:left">Arti</th></tr></thead><tbody>
       <tr><td><i class="dot" style="background:var(--c-prod)"></i>Production</td><td style="text-align:left;white-space:normal">Mesin memproses kain</td></tr>
       <tr><td><i class="dot" style="background:var(--c-fail)"></i>Failure</td><td style="text-align:left;white-space:normal">Kerusakan mekanik, elektrik, oil heater, dll.</td></tr>
       <tr><td><i class="dot" style="background:var(--c-idle)"></i>Idle</td><td style="text-align:left;white-space:normal">Ganti batcher, palet, persiapan, kebersihan</td></tr>
       <tr><td><i class="dot" style="background:var(--c-lr)"></i>Line Restraint</td><td style="text-align:left;white-space:normal">Mesin menunggu, misalnya stock kosong</td></tr>
       <tr><td><i class="dot" style="background:var(--c-unsch)"></i>Unscheduled</td><td style="text-align:left;white-space:normal">Istirahat, pemanasan, preventif mtc. Tidak masuk loading time</td></tr></tbody></table></div>
     <h3>Produk (kategori kualitas)</h3>
     <p class="hint">A = produk baik, B = Quality Reproses, C = reject. Quality = A ÷ total output aktual.</p>
     <h3>Rumus</h3>
     <pre>Loading time  = Total waktu terdaftar − Unscheduled
Availability  = Waktu Production ÷ Loading time
Performance   = Output aktual ÷ Target output
Quality       = Output produk A ÷ Output aktual
OEE           = A × P × Q
Imposed out.  = Σ (speed × menit produksi)
Speed loss    = Target − Imposed
Minor stops   = Imposed − Aktual
MTBF = Loading ÷ Σ FREQ kerusakan
MTTR = Menit kerusakan ÷ Σ FREQ kerusakan</pre>
     <h3>Aktivitas yang dikenali (${acts.size})</h3>
     <div class="tw tall" style="max-height:260px"><table><thead><tr><th>Aktivitas</th><th style="text-align:left">Kategori</th></tr></thead><tbody>${[...acts].sort((a,b)=>a[1].localeCompare(b[1])||a[0].localeCompare(b[0])).map(([k,c])=>`<tr><td>${esc(k)}</td><td style="text-align:left">${c}</td></tr>`).join('')}</tbody></table></div>
     <p class="hint">Nama aktivitas dengan beda huruf besar/kecil digabung otomatis (misalnya “ISTIRAHAT” dan “Istirahat”).</p>
   </div></div>`;
  root.onchange=e=>{const t=e.target;if(t.dataset.mc!=null){const m=machines.find(x=>x.name===t.dataset.mc);if(m){m.on=t.checked;saveMachines();render(false,true)}}};
};

/* ===== NOTE & SPEED ===== */
let nMc='';
views.note=function(root){
  const mcs=activeMcs(), hist=new Map();
  for(const r of rows){ if(r.cat!=='Production'||!r.sp)continue; if(nMc&&r.mc!==nMc)continue; if(!mcs.includes(r.mc))continue;
    const k=r.mc+'|'+r.sp+'|'+r.st; let h=hist.get(k); if(!h){h={mc:r.mc,sp:r.sp,st:r.st,from:r.d,to:r.d,n:0,min:0};hist.set(k,h)} h.from=Math.min(h.from,r.d);h.to=Math.max(h.to,r.d);h.n++;h.min+=r.len}
  const list=[...hist.values()].sort((a,b)=>mcs.indexOf(a.mc)-mcs.indexOf(b.mc)||a.from-b.from);
  const multi=new Map(); list.forEach(h=>multi.set(h.mc,(multi.get(h.mc)||0)+1));
  root.innerHTML=`<div class="grid g-side">
   <div class="panel"><h2>Catatan di spreadsheet</h2>
     <div class="tw"><table><thead><tr><th>Tanggal</th><th style="text-align:left">Keterangan</th><th style="text-align:left">Mesin</th><th>Speed</th></tr></thead><tbody>
       <tr><td style="text-align:left"></td><td style="text-align:left;white-space:normal">Belum ada catatan speed untuk Printing.</td><td></td><td></td></tr></tbody></table></div>
     <p class="hint">Riwayat speed otomatis dari data produksi ada di sebelah kanan.</p></div>
   <div class="panel"><h2>Riwayat speed dari data produksi</h2>
     <div class="filters"><label class="f">Mesin<select id="nMc"><option value="">Semua mesin</option>${mcs.map(m=>`<option ${m===nMc?'selected':''}>${esc(m)}</option>`).join('')}</select></label>
       <div class="hint" style="align-self:center">Setiap kombinasi speed dan standar yang pernah dipakai pada baris Production. Mesin dengan lebih dari satu kombinasi diberi tanda.</div></div>
     <div class="tw tall"><table><thead><tr><th>Mesin</th><th>Speed</th><th>Standar</th><th>Pertama</th><th>Terakhir</th><th>Baris</th><th>Menit</th></tr></thead><tbody>
     ${list.map(h=>`<tr><td>${esc(h.mc)}${multi.get(h.mc)>1?' <span class="pill">berubah</span>':''}</td><td class="num ${h.sp!==h.st?'cell-bad':''}">${h.sp}</td><td class="num">${h.st}</td><td class="num">${fmtD(h.from)}</td><td class="num">${fmtD(h.to)}</td><td class="num">${fmtN(h.n)}</td><td class="num">${fmtN(h.min)}</td></tr>`).join('')||'<tr><td colspan="7" class="hint">Tidak ada data.</td></tr>'}
     </tbody></table></div>
     <p class="hint">Speed berwarna merah berarti berbeda dari standar, sehingga Performance bisa di bawah atau di atas 100%.</p></div></div>`;
  $('#nMc',root).onchange=e=>{nMc=e.target.value;render(true,true)};
};

/* ===== PERFORMA PRINTING: dashboard Performance Dept. Printing PGG, ditanam dalam iframe agar CSS/script-nya tidak bentrok ===== */
function syncPrnTheme(){
  const fr=document.getElementById('prnFrame'); if(!fr)return;
  let d=null; try{d=fr.contentDocument}catch(_){}
  if(!d||!d.documentElement)return;
  const t=document.documentElement.dataset.theme;
  if(t)d.documentElement.dataset.theme=t; else d.documentElement.removeAttribute('data-theme');
}
new MutationObserver(syncPrnTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
views.printing=function(root){
  if(root.querySelector('#prnFrame')){syncPrnTheme();return}   /* refresh data OEE tidak me-reload dashboard ini */
  root.innerHTML='<iframe id="prnFrame" class="prnframe" title="Performa Printing" scrolling="no"></iframe>';
  const fr=root.querySelector('#prnFrame');
  fr.addEventListener('load',()=>{
    const d=fr.contentDocument; if(!d||!d.documentElement||!d.body)return;
    syncPrnTheme();
    const fit=()=>{fr.style.height=Math.ceil(d.documentElement.offsetHeight)+'px'};
    fit();
    if(window.ResizeObserver)new ResizeObserver(fit).observe(d.documentElement);
    else setInterval(fit,700);
    d.addEventListener('click',()=>setTimeout(fit,60));
  });
  fr.srcdoc=document.getElementById('prnSrc').textContent.replace(/<\\\/script/gi,'</script');
};

/* ---------- shell ---------- */
function drawTabs(){
  const pop=$('#pop'), t=TABS.find(x=>x[0]===cur)||TABS[0];
  $('#curName').textContent=t[1]; $('#curSub').textContent=t[2];
  pop.innerHTML=TABS.map(x=>`<button type="button" role="menuitem" id="tab-${x[0]}" data-t="${x[0]}" ${x[0]===cur?'aria-current="page"':''}><b>${x[1]}</b><small>${x[2]}</small></button>`).join('');
}
function setMenu(open){const p=$('#pop'),b=$('#menuBtn');p.hidden=!open;b.setAttribute('aria-expanded',open?'true':'false')}
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();setMenu($('#pop').hidden)});
$('#pop').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.t;store.set('oee.tab',cur);drawTabs();setMenu(false);render();scrollTo(0,0)});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))setMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#pop').hidden){setMenu(false);$('#menuBtn').focus()}});
function lapPageStyle(){
  let s=document.getElementById('lapPage');
  if(cur==='laporan'){if(!s){s=document.createElement('style');s.id='lapPage';s.textContent='@page{size:297mm 167mm;margin:0}';document.head.appendChild(s)}}
  else if(s)s.remove();
}
function render(keep,noScroll){
  lapPageStyle();
  const root=$('#view'), sy=scrollY; root.onchange=null;root.onclick=null;root.onkeydown=null;
  const bodyScroll=root.querySelector('.tw');
  if(!rows.length&&cur!=='input'&&cur!=='printing'){root.innerHTML='<div class="note">Menunggu data dari Google Sheets. Jika tidak muncul, buka tab DATA SPREADSHEET lalu klik Refresh data. Halaman harus dibuka dari GitHub Pages, bukan dari claude.ai.</div>';return}
  try{views[cur](root,keep)}catch(err){root.innerHTML='<div class="note" style="border-left-color:var(--bad)">Terjadi kesalahan saat menampilkan tab: '+esc(err.message)+'</div>';console.error(err)}
  if(noScroll)scrollTo(0,sy);
}
$('#logoutBtn').onclick=()=>{try{sessionStorage.removeItem('oee.auth')}catch(_){}location.reload()};
$('#themeBtn').onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark'; store.set('oee.theme',r.dataset.theme);
};
const th=store.get('oee.theme',null); if(th)document.documentElement.dataset.theme=th;

loadSnapshot(); drawTabs(); render(); liveLoad(true); setAuto();
if(location.hash){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){cur=h;drawTabs();render()}}
})();
</script>
